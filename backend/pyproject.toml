[project]
name = "uh-ni-me-backend"
version = "0.1.0"
description = "UH-NI-ME backend: FastAPI API, data ingest and daily puzzle jobs"
authors = [
    { name = "Alex Tran", email = "tranalex3427@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
# Application, not an installable library: modules (app, ingest, jobs) are run
# from backend/, e.g. `uv run uvicorn app.main:app`.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
